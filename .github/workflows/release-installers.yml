name: Release Apple Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.5.17"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apple-installers:
    name: iOS IPA and macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Build unsigned macOS app
        run: |
          flutter build macos --release --config-only --no-pub
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Stage Apple installers
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
            version="${version#v}"
          fi
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qry "dist/daily-ios-${version}-unsigned.ipa" Payload
          hdiutil create \
            -volname Daily \
            -srcfolder build/macos/Build/Products/Release/Daily.app \
            -ov \
            -format UDZO \
            "dist/daily-macos-${version}-unsigned.dmg"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Daily ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES_2.5.17.md
          files: |
            dist/daily-ios-*-unsigned.ipa
            dist/daily-macos-*-unsigned.dmg
          fail_on_unmatched_files: true
