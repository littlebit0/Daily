name: Release IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.5.17"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Stage IPA
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
            version="${version#v}"
          fi
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qry "dist/daily-ios-${version}-unsigned.ipa" Payload

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Daily ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES_2.5.17.md
          files: dist/daily-ios-*-unsigned.ipa
          fail_on_unmatched_files: true
